<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hope</title>
<style>
:root { --bg:#fbf7f2; --card:#fff; --ink:#2d2a32; --muted:#7a7280; --accent:#b5687a; --line:#ece4dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1a1f; --card:#26232a; --ink:#eee9f0; --muted:#a59eaa; --accent:#e29aac; --line:#36313b; } }
:root[data-theme="dark"] { --bg:#1c1a1f; --card:#26232a; --ink:#eee9f0; --muted:#a59eaa; --accent:#e29aac; --line:#36313b; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; text-align:center; }
h1 { margin:0 0 4px; font-size:1.4rem; color:var(--accent); }
p { margin:0 0 18px; color:var(--muted); font-size:.9rem; }
input[type=password] { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:var(--bg); color:var(--ink); }
label { display:flex; gap:8px; align-items:center; justify-content:center; margin:12px 0 16px; font-size:.85rem; color:var(--muted); }
button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; }
.err { color:#c0392b; min-height:1.4em; margin:10px 0 0; font-size:.85rem; }
</style>
</head>
<body>
<form id="f">
  <h1>Hope</h1>
  <p>This page is private. Enter the passphrase to open it.</p>
  <input type="password" id="p" autocomplete="current-password" placeholder="Passphrase" required autofocus>
  <label><input type="checkbox" id="r" checked> Remember on this device</label>
  <button type="submit" id="b">Open</button>
  <div class="err" id="e"></div>
</form>
