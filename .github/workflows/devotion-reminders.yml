name: Devotion Reminders

# The real clock is cron-job.org, which calls workflow_dispatch (blank date)
# at 8:00am and 8:30pm Abuja. GitHub's own schedule below is only a fallback:
# it often starts runs hours late (8:07am fired at 3:23pm on 1 Oct), so any
# run that isn't a dated manual resend first checks whether its edition
# already went out.
on:
  schedule:
    - cron: '7 7 * * *'     # 8:07am Abuja — morning (primary)
    - cron: '37 7 * * *'    # 8:37am Abuja — morning (backup)
    - cron: '23 19 * * *'   # 8:23pm Abuja — evening (primary)
    - cron: '43 19 * * *'   # 8:43pm Abuja — evening (backup)
  workflow_dispatch:
    inputs:
      edition:
        description: 'morning or evening'
        default: 'morning'
        type: choice
        options: [morning, evening]
      date:
        description: 'Optional day to send, e.g. "13 Oct" (blank = today)'
        required: false
        default: ''

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' && format('Devotion {0} {1} (manual)', inputs.edition, inputs.date) || github.event_name == 'workflow_dispatch' && format('Devotion {0}', inputs.edition) || (startsWith(github.event.schedule, '7 7') || startsWith(github.event.schedule, '37 7')) && 'Devotion morning' || 'Devotion evening' }}

permissions:
  actions: read
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || (startsWith(github.event.schedule, '7 7') || startsWith(github.event.schedule, '37 7')) && 'morning' || 'evening' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this edition already went out today
        id: dedupe
        if: github.event_name == 'schedule' || inputs.date == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs can start hours late and cross midnight, so key on the day a
          # run belongs to: Abuja time (+1h), and for the evening edition
          # anything before noon counts as the previous night (-12h).
          off=3600; [ "$EDITION" = evening ] && off=-39600
          slot=$(date -u -d "@$(( $(date +%s) + off ))" +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow devotion-reminders.yml --status success --limit 30 \
                --json displayTitle,createdAt \
                --jq "[.[] | select(.displayTitle == \"Devotion ${EDITION}\" and ((.createdAt | fromdateiso8601) + ${off} | todate | startswith(\"${slot}\")))] | length")
          echo "already=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] && echo "Not sent yet today — sending." || echo "The ${EDITION} devotion already went out today — skipping."

      - name: Send the devotion email
        if: steps.dedupe.outcome == 'skipped' || steps.dedupe.outputs.already == '0'
        env:
          DEVOTION_DATE: ${{ inputs.date }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEVOTION_RECIPIENTS: ${{ secrets.DEVOTION_RECIPIENTS }}
        run: python3 .github/scripts/send_devotion.py
