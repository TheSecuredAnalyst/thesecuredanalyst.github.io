name: Devotion Reminders

on:
  schedule:
    # 07:00 UTC = 8:00am Abuja — morning devotion
    - cron: '0 7 * * *'
    # 19:30 UTC = 8:30pm Abuja — evening questions and prayer, before 9pm prayer
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: 'morning or evening'
        default: 'morning'
        type: choice
        options: [morning, evening]
      date:
        description: 'Optional day to send, e.g. "13 Oct" (blank = today)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send the devotion email
        env:
          EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || (github.event.schedule == '0 7 * * *' && 'morning' || 'evening') }}
          DEVOTION_DATE: ${{ inputs.date }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEVOTION_RECIPIENTS: ${{ secrets.DEVOTION_RECIPIENTS }}
        run: python3 .github/scripts/send_devotion.py
